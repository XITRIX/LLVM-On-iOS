name: Build RPCS3 LLVM for iOS 26

on:
  push:
    branches: [master]
    paths:
      - build-llvm.sh
      - .github/workflows/main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llvm-ios26-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install cmake ninja

      - name: Build native TableGen
        run: ./build-llvm.sh native-tools

      - name: Cross-compile static LLVM
        run: ./build-llvm.sh build

      - name: Validate and package
        id: package
        run: |
          ./build-llvm.sh package | tee package.env
          cat package.env >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ios26-arm64-${{ github.sha }}
          path: .build/packages/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="llvm-ios26-ca7933e47d3a3451-${GITHUB_SHA:0:12}"
          title="RPCS3 LLVM for iOS 26 (${GITHUB_SHA:0:12})"
          notes="Static arm64 iOS 26 LLVM libraries pinned to llvm-project ca7933e47d3a3451d81e72ac174dcb5aa28b59d1. Includes headers, component archives, and LLVM CMake package files."
          gh release create "$tag" .build/packages/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes"
